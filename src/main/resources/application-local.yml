# 本地开发数据源 —— 会话表在 MySQL(fan_ai_agent)。
# 密钥/密码一律不写在本文件：从环境变量或 config/local-secrets.yml 注入（模板见 local-secrets.example.yml）。
spring:
  # 机密文件已 gitignore，缺失时静默跳过（optional:），此时必须用环境变量注入。
  config:
    import: optional:file:./config/local-secrets.example.yml
  datasource:
    url: "jdbc:mysql://127.0.0.1:3306/fan_ai_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: root
    password: "${MYSQL_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver

# RAG 知识库配置
rag:
  kb:
    dir: ./kb-test-data/valid # 入库扫描目录(只扫该层,不递归); 生产指向真实知识库
  retrieval:
    top-k: 5                 # 最终注入 prompt 的条数（在两层层门禁剔除之后截断）
    candidates-per-query: 15 # 每路查询召回条数；要比 top-k 宽，否则门禁剔完凑不满。0=按 top-k*3 自动
    max-query-variants: 3    # 查询变体上限（原问题恒为第 1 路，其余由术语表改写而来）
    rrf-k: 60                # RRF 平滑常数，越小则排名靠前的越占优；60 是原论文默认值
    terms-file: classpath:kb-terms.yml  # 业务术语表：员工口语 → 制度用语
  # 输出侧 Guardrails：答案里的金额/比例/期限必须能在检索到的原文中找到出处，否则拒答。
  # 只查这三类（不查计数/条款号/日期）是刻意的取舍：漏了只是少一道防线，误报会把正确回答拦掉。
  guardrails:
    numeric:
      enabled: true   # 关掉即退回改造前行为（答案不校验直接返回），留着是为了能对比演示
  # L1 情景记忆（MemoryAdvisor）：读最近 N 轮历史注入 prompt，轮末把"结论 + 指针"落库。
  # 设计取舍见《银行RAG-07-记忆分层与断点续传设计》§一/§二 L1；表结构见 sql/chat_message.sql。
  # 这里写出来是为了"看得见、改得动"—— @Value 里都带默认值，删掉整段也能跑。
  memory:
    enabled: true                 # 关掉即逐字节退回无记忆行为（不读库不写库），用来做对比演示
    window-turns: 3               # 注入最近几轮（一轮 = user + assistant 两条消息）
    max-chars-per-message: 2000   # 注入侧单条截断长度；0=不截断。仅影响 prompt，库里永远存原文
    retention-days: 30            # 留存到期(expires_at = created_at + N 天)；0=不设过期
    # 读历史时是否按**本轮实况信封**过滤(阶段 1)：该轮内容密级 > 本轮信封密级 → 整轮不进 prompt。
    # 关掉即退回阶段 0 的行为——降级用户仍能读到自己旧轮的高密级结论，
    # 也就是 §一 表 #2「降级后仍可读」的漏洞现场。留着这个开关正是为了能复现它、做对比演示。
    # ⚠️ 只关读取、不关写入：写入侧算密级是记账(没有拒绝语义)，关掉只会让库里的行"密级未知"。
    clearance-filter-enabled: true
    # prompt 预算上限 ≈ window-turns × 2 × max-chars-per-message = 3 × 2 × 2000 = 12000 字符
    # ------------------------------------------------------------------
    # L2 语义记忆（跨会话的稳定事实）
    # 设计取舍见《银行RAG-07》§A.2/§A.3/§四；表结构见 sql/user_memory.sql、sql/memory_change_log.sql。
    # ⚠️ 与上面的 L1 开关**互相独立**：可以只留 L1（关掉本段 = 阶段 1 的行为），
    #    但反过来不成立——L1 关掉时 L2 一定不写，因为它拿不到本轮轮号（无源不写）。
    semantic:
      enabled: true                 # 关掉即退回「只记得住本会话」，用来做对比演示
      # 复述验证（阶段 2 的安全核心）：候选事实必须能在**该轮用户原话**里找到要素支撑。
      # 关掉即复现漏洞现场——模型**推测**出的假事实也会落库：用户只是在问
      # 「大额存单利率多少」，模型就会把「偏好产品=大额存单」当成事实记下来。
      # 这个开关的用途与上面的 clearance-filter-enabled 逐字对应：**能关掉一个防护，
      # 才证明那个防护真的在起作用**（见 L2GroundingOffChainTest）。
      grounding-enabled: true
      quota-per-user: 200           # 每用户有效事实上限；到顶只拒**新增**，改口/续期不受限
      recall-limit: 10             # 每轮最多取回几条候选(不是最终注入条数——信封与过期还要再滤)
      max-facts-per-block: 10       # 注入区块最多渲染几条
      max-line-chars: 80            # 单条事实行长上限，超了**整条丢弃**（腰斩的值是假事实）
      max-block-chars: 800          # 事实块整块字符上限（含声明），超了从尾部整条丢
      # ↓ 这两个是**蒸馏线程池**的参数，会话压缩用的是**同一个池**（一个池只有一个容量）
      distill-threads: 2            # 一次蒸馏 = 一次秒级 LLM 往返；队列满按「拒绝 + 打 WARN」处理
      distill-queue-capacity: 200
    # ------------------------------------------------------------------
    # 会话摘要/压缩（RAG-07 §5.5）：把滑出窗口的那段历史压成**定位**信息
    # 设计取舍见 §5.5 与附录 A1；表结构见 sql/session_summary.sql。
    # ⚠️ A1 把「把摘要当成解法」列为**已知偏差**，校正结论是「摘要只能用来定位、不能承载事实」——
    #    所以摘要里出现金额/比例/期限会被 Java 侧打回重写，仍违规就**整份丢弃**
    #    （宁可让窗口滑走，也不让「1.35% → 讨论了存款利率」这种损失进入未来所有轮次的上下文）。
    summary:
      enabled: true                 # 关掉 = L1 退回硬滑窗，「第 3 轮以前整段消失」可现场复现
      max-summary-chars: 600        # 一份摘要的字符上限；超了**丢弃整份**而不是截断
      budget-chars: 8000            # 上下文预算(字符数，classpath 上没有 tokenizer)。是**预算**不是计费数字
      # §5.5 的 token 规则。⚠️ 本阶段**只做观测**：超了只打一条 WARN，不触发再压缩——
      # 那条规则是为恢复场景写的，而我们的窗口是连续滑动的（压的也是已经滑出去的内容，
      # 压完体积不会变小）。真正生效的触发是「有轮次滑出窗口且未被摘要覆盖」，见 SessionSummaryService。
      trigger-ratio: 0.7
      # 单轮送进压缩器的文本上限，按**每条消息**算（所以一轮最多 2×）
      source-turn-max-chars: 500
      retention-days: 30            # 摘要保质期；与 L1 的 retention-days 同口径但互相独立
  # embedding：硅基流动 SiliconFlow OpenAI 兼容接口（https://cloud.siliconflow.cn，BAAI/bge-m3 免费额度）
  # base-url 不带 /v1：Spring AI 用默认 embeddings-path=/v1/embeddings 追加，拼成 .../v1/embeddings
  embedding:
    model: BAAI/bge-m3
    base-url: https://api.siliconflow.cn
    api-key: ${SILICONFLOW_API_KEY}   # 硅基流动 API Key，来源见文件头
  vectorstore:
    enabled: true           # 开启后需要: PG 数据源 + embedding 模型(行内闭环)
    dimensions: 1024        # 与 embedding 输出维度一致(bge-m3=1024)
    datasource:
      url: "jdbc:postgresql://pgm-bp1r1p7m7d9vm33mdo.rwlb.rds.aliyuncs.com:5432/rag_kb"
      username: fanyh_new
      password: "${PG_PASSWORD}"