# 本地开发数据源 —— 会话表在 MySQL(fan_ai_agent)。
# 注意：password 含本地默认值，仅供 local profile 开发使用；生产必须用环境变量注入，勿提交明文。
spring:
  datasource:
    url: "jdbc:mysql://127.0.0.1:3306/fan_ai_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: root
    password: "${MYSQL_PASSWORD:!QAZ2wsx}"
    driver-class-name: com.mysql.cj.jdbc.Driver

# RAG 知识库配置
rag:
  kb:
    dir: ./kb                # 入库扫描目录
  retrieval:
    top-k: 5                 # 每次检索取回条数
  # embedding：阿里云百炼 DashScope OpenAI 兼容接口(与 DeepSeek chat 分离)
  embedding:
    model: text-embedding-v3
    dimensions: 1024         # text-embedding-v3 支持 512/768/1024；PG 向量列维度须与此一致
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${DASHSCOPE_API_KEY:}   # 用环境变量注入,勿提交明文
  vectorstore:
    enabled: false           # 开启后需要: PG 数据源 + rag.embedding.*
    dimensions: 1536
    datasource:
      url: "jdbc:postgresql://127.0.0.1:5432/pgvector_db"
      username: postgres
      password: "${PG_PASSWORD:}"
