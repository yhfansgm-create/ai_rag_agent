# 业务术语表 —— 解决"员工用口语问、制度用条文写"的词汇不匹配
#
# canonical: 制度/文件里的标准写法（检索时希望命中的写法）
# aliases:   员工平时可能用的说法（越贴近真实口语越好，可以从坐席录音、工单标题里挖）
#
# 维护建议：
#   1. 词条来源不是拍脑袋，而是"检索失败日志"—— 把用户问了但没召回的问题捞出来，人工归类
#   2. aliases 只放真正的同义说法，不要放上位词/下位词（"存款"不是"大额存单"的别名）
#   3. 这张表是业务资产，由业务部门维护，不该由开发随手改
terms:
  - canonical: 带薪年休假
    aliases: ["年假", "公休假", "带薪休假"]

  - canonical: 跨行汇款
    aliases: ["跨行转账", "跨行支付", "他行汇款"]

  - canonical: 个人大额存单
    aliases: ["大额存单", "大额定期"]

  - canonical: 借记卡
    aliases: ["储蓄卡"]

  - canonical: 贷记卡
    aliases: ["信用卡"]

  - canonical: 口头挂失
    aliases: ["电话挂失", "临时挂失"]

  - canonical: 可疑交易报告
    aliases: ["大额可疑报告", "可疑报告", "SAR"]

  - canonical: 授信额度
    aliases: ["信用额度", "授信限额"]

  - canonical: 拨备覆盖率
    aliases: ["拨备率"]

  - canonical: 反洗钱
    aliases: ["AML", "反洗钱合规"]
